<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fetch Run</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./libs/three.module.js" } }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="overlay hidden">
    <div id="hud-distance">0m</div>
    <div id="hud-balls">🎾 0</div>
    <div id="hud-closecalls"></div>
    <div id="hud-power" class="hidden"></div>
    <div id="hud-life" class="hidden">🥩 EXTRA LIFE</div>
    <div id="stage-banner" class="hidden"></div>
  </div>

  <div id="menu" class="overlay">
    <h1>FETCH RUN</h1>
    <p class="subtitle">(working title)</p>
    <p id="menu-best" class="best hidden"></p>
    <p id="menu-bank" class="bank hidden"></p>
    <p class="prompt">Tap anywhere to run</p>
    <div class="controls-box">
      <p class="controls-label">RUNNER</p>
      <div class="controls-row">
        <button id="btn-gsp" class="scheme-btn">THE DOG</button>
        <button id="btn-golden" class="scheme-btn">GOLDIE</button>
        <button id="btn-cat" class="scheme-btn">TUX</button>
      </div>
    </div>
    <div class="controls-box">
      <p class="controls-label">CONTROLS</p>
      <div class="controls-row">
        <button id="btn-tap" class="scheme-btn">TAP ZONES</button>
        <button id="btn-swipe" class="scheme-btn">SWIPE</button>
      </div>
      <p id="scheme-hint" class="hint"></p>
    </div>
  </div>

  <div id="intro-hint" class="overlay hidden">
    <p class="skip-hint">tap to skip</p>
  </div>

  <div id="death" class="overlay hidden">
    <div class="card">
      <h2 id="death-title">WIPEOUT!</h2>
      <p id="death-distance" class="big-distance"></p>
      <p id="death-best" class="best"></p>
      <div class="stat-rows">
        <div class="row"><span>stage</span><b id="d-stage"></b></div>
        <div class="row"><span>time</span><b id="d-time"></b></div>
        <div class="row"><span>top speed</span><b id="d-speed"></b></div>
        <div class="row"><span>🎾 collected</span><b id="d-balls"></b></div>
        <div class="row"><span>close calls</span><b id="d-close"></b></div>
      </div>
      <p class="subhead">LIFETIME</p>
      <div class="stat-rows small">
        <div class="row"><span>runs</span><b id="l-runs"></b></div>
        <div class="row"><span>distance</span><b id="l-dist"></b></div>
        <div class="row"><span>🎾 banked</span><b id="l-balls"></b></div>
      </div>
      <p class="subhead">RECENT RUNS</p>
      <div id="recent-runs" class="recent"></div>
    </div>
    <div id="death-actions" class="death-actions hidden">
      <button id="btn-again" class="action-btn primary">RUN AGAIN</button>
      <button id="btn-home" class="action-btn">HOME</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
